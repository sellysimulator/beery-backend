# Render Blueprint for the Beery backend (00-decisions.md D17,
# 23-deployment-and-ci.md §3). One web service, built from the committed
# Dockerfile -- plain uvicorn, no gunicorn (game_stack.md §3).
#
# Managed MySQL is NOT declared here: Render's own managed database offering
# is PostgreSQL, so this project's managed MySQL is provisioned separately
# (e.g. PlanetScale/RDS) and wired in through the DB_* environment variables
# below, set on the platform, never committed. See DEPLOY.md.
#
# Redis is OPTIONAL and is likewise not declared here. Since the state
# backend became switchable, REDIS_ENABLED=false (the default) keeps live
# room state in the process and the service has no Redis dependency at all --
# correct for the single-instance classroom deployment this plan describes,
# at the cost of losing in-progress games on any restart or deploy. Turning
# it on means provisioning Redis separately (e.g. Redis Cloud/Upstash) and
# setting both REDIS_ENABLED and REDIS_URL below. See DEPLOY.md.
#
# The managed MySQL instance MUST run engine version 8.4 -- the same
# `mysql:8.4` image `tests/test_models/conftest.py` pins its Testcontainers
# schema suite to (23-deployment-and-ci.md AC 15). Provisioning a different
# major version makes CI prove the wrong engine.
services:
  - type: web
    name: beery-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    # Render deploys a push to the linked branch only once every GitHub check
    # on that commit has passed -- this IS the CI gate. There is deliberately no
    # deploy job or deploy hook in ci.yml: with both, a passing push deploys
    # twice, and with plain on-commit auto-deploy a failing push ships anyway.
    autoDeployTrigger: checksPass
    # Runs once per deploy, before traffic is switched to the new instance --
    # not `create_all()`, and not at application startup, where a migration
    # racing N container instances is a lock-contention problem waiting to
    # happen (§3.3).
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DEBUG
        value: "false"
      # Never ["*"]: this app sets allow_credentials=True (§3.2, AC 5).
      - key: CORS_ORIGINS
        value: '["https://beersim.web.app","http://localhost:5173"]'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_REQUIRE_SSL
        sync: false
      # Optional. "false" keeps live room state in this process, which
      # REQUIRES that this service runs as exactly one instance with no
      # `--workers`, and loses in-progress games on every deploy or restart.
      # Set it to "true" -- together with a REDIS_URL -- before scaling past
      # one instance, or the two instances silently split every room.
      - key: REDIS_ENABLED
        value: "false"
      # Read only when REDIS_ENABLED is "true", and then required: an empty
      # REDIS_URL with the flag on refuses to start. It must point at a live,
      # non-free-tier instance -- a reclaimed free-tier Redis returns NXDOMAIN
      # and every room operation fails (§3.4).
      - key: REDIS_URL
        sync: false
      # The whole service account JSON, on one line, single-quoted or
      # unquoted -- double quotes corrupt it (§3.2, AC 6, failure mode 3).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
