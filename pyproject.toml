[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
# Some skeleton tests exercise the checks/ discovery loop by writing a
# throwaway module inside app/core/checks/ and deleting it once the test
# ends. Coverage still has line hits recorded against that path by the time
# a standalone `coverage report` runs afterwards, and without this the
# report step errors out entirely instead of just omitting a file that no
# longer exists.
ignore_errors = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
